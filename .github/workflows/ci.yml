name: STRATA checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strata-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints.txt
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      # JavaScript uses the Node standard library; no npm dependencies to install.
      - name: Node regression tests
        run: npm test
      - name: Static source checks
        run: npm run check
      - name: Controlled validation fixtures
        run: npm run validate
      - name: Backend and backup regressions
        run: python -m pytest backend/tests tests -q
